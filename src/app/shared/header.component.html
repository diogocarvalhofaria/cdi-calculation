<header class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-sm dark:bg-slate-900/80 shadow-sm">
  <nav class="mx-auto max-w-screen-xl px-4 lg:px-6 py-3">
    <div class="flex flex-wrap justify-between items-center">
      <a routerLink="/" class="flex items-center">
        <!-- Logo -->
        <span class="self-center text-2xl font-bold whitespace-nowrap text-[#2563eb] dark:text-white font-poppins">CDIFácil</span>
      </a>

      <div class="flex items-center lg:order-2 space-x-4">
        <!-- Links de Navegação (Desktop) -->
        <div class="hidden lg:flex items-center space-x-8">
          <a routerLink="/" class="text-sm font-medium text-gray-700 hover:text-[#2563eb] dark:text-gray-300 dark:hover:text-white transition-colors duration-300">Início</a>
          <a routerLink="/blog" class="text-sm font-medium text-gray-700 hover:text-[#2563eb] dark:text-gray-300 dark:hover:text-white transition-colors duration-300">Blog</a>
        </div>

        <!-- Dark Mode Toggle -->
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>

        <!-- Botão Menu Mobile -->
        <button data-collapse-toggle="mobile-menu" type="button" class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600" aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Abrir menu</span>
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
        </button>
      </div>

      <!-- Menu Mobile -->
      <div class="hidden justify-between items-center w-full lg:hidden" id="mobile-menu">
        <ul class="flex flex-col mt-4 font-medium">
          <li>
            <a routerLink="/" class="block py-2 pr-4 pl-3 text-gray-700 rounded hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white">Início</a>
          </li>
          <li>
            <a routerLink="/blog" class="block py-2 pr-4 pl-3 text-gray-700 rounded hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white">Blog</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
