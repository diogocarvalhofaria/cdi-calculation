<section class="bg-gray-50">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-blue-600">
      CDIFácil
    </a>
    <div class="w-full bg-white rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl">
          Redefinir senha
        </h1>

        <div *ngIf="error" class="p-4 mb-4 text-sm text-red-800 border border-red-300 rounded-lg bg-red-50">
          {{ error }}
        </div>

        <div *ngIf="message" class="p-4 mb-4 text-sm text-green-800 border border-green-300 rounded-lg bg-green-50 flex items-center">
          <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path fill="currentColor" d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/>
          </svg>
          {{ message }}
        </div>

        <form *ngIf="token && !message" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 md:space-y-6">
          <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Nova senha</label>
            <input type="password" id="password" formControlName="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5" placeholder="••••••••">
            <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-red-500 text-xs mt-1">
              A senha deve ter pelo menos 6 caracteres.
            </div>
          </div>

          <div>
            <label for="confirm-password" class="block mb-2 text-sm font-medium text-gray-900">Confirmar senha</label>
            <input type="password" id="confirm-password" formControlName="confirmPassword" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5" placeholder="••••••••">
            <div *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched" class="text-red-500 text-xs mt-1">
              As senhas não conferem.
            </div>
          </div>

          <button type="submit" [disabled]="form.invalid || loading" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:bg-gray-400">
            <span *ngIf="loading">Processando...</span>
            <span *ngIf="!loading">Redefinir senha</span>
          </button>

          <p class="text-sm font-light text-gray-500 text-center">
            <a routerLink="/login" class="font-medium text-blue-600 hover:underline">Voltar para login</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
